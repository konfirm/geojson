name: Bug report
description: Something isn't working correctly
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "e.g. 2.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest piece of code that shows the problem.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Node version, OS, anything else relevant.
